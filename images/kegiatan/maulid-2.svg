<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaulid2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgMaulid2)" />
  
  <!-- Quran / Book Stand (Rehal) -->
  <circle cx="400" cy="300" r="160" fill="#FF7A00" opacity="0.1" />
  
  <!-- Open Book -->
  <path d="M400 340 C350 310 280 310 240 330 L240 230 C280 210 350 210 400 240 C450 210 520 210 560 230 L560 330 C520 310 450 310 400 340 Z" fill="#F8FAFC" />
  <line x1="400" y1="240" x2="400" y2="340" stroke="#CBD5E1" stroke-width="3" />
  <!-- Text lines on book -->
  <line x1="260" y1="250" x2="380" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="260" y1="270" x2="380" y2="270" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="260" y1="290" x2="360" y2="290" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="420" y1="250" x2="540" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="420" y1="270" x2="540" y2="270" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="420" y1="290" x2="520" y2="290" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Wooden Stand X -->
  <polygon points="260,340 540,460 510,480 230,360" fill="#78350F" />
  <polygon points="540,340 260,460 290,480 570,360" fill="#92400E" />

  <!-- Floor -->
  <rect x="0" y="480" width="800" height="120" fill="#022C22" />

  <!-- Label Badge -->
  <rect x="40" y="40" width="190" height="38" rx="6" fill="#FF7A00" />
  <text x="55" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Maulid Nabi #2</text>
</svg>
