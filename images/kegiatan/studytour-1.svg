<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTour1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgTour1)" />
  
  <!-- Bus / Travel Silhouette -->
  <!-- Road -->
  <path d="M0 480 L800 480 L800 600 L0 600 Z" fill="#1E293B" />
  <line x1="0" y1="540" x2="800" y2="540" stroke="#F59E0B" stroke-width="8" stroke-dasharray="30 20" />
  
  <!-- Bus Body -->
  <rect x="200" y="240" width="400" height="200" rx="20" fill="#FF7A00" />
  <rect x="200" y="380" width="400" height="60" fill="#EA580C" />
  
  <!-- Windows -->
  <rect x="220" y="260" width="60" height="80" rx="6" fill="#E2E8F0" />
  <rect x="300" y="260" width="70" height="80" rx="6" fill="#E2E8F0" />
  <rect x="390" y="260" width="70" height="80" rx="6" fill="#E2E8F0" />
  <rect x="480" y="260" width="100" height="80" rx="6" fill="#E2E8F0" />
  
  <!-- Bus Wheels -->
  <circle cx="280" cy="440" r="45" fill="#0F172A" />
  <circle cx="280" cy="440" r="20" fill="#94A3B8" />
  <circle cx="520" cy="440" r="45" fill="#0F172A" />
  <circle cx="520" cy="440" r="20" fill="#94A3B8" />

  <!-- Mountain Silhouettes -->
  <polygon points="50,480 220,320 380,480" fill="#0369A1" opacity="0.4" />
  <polygon points="300,480 500,280 700,480" fill="#0369A1" opacity="0.3" />

  <!-- Label Badge -->
  <rect x="40" y="40" width="180" height="38" rx="6" fill="#FF7A00" />
  <text x="55" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Study Tour #1</text>
</svg>
