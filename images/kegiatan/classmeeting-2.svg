  <!-- Label Badge -->
  <rect x="40" y="40" width="230" height="38" rx="6" fill="#FF7A00" />
  <text x="55" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Class Meeting #2</text>
