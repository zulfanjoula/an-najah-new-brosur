    <circle cx="150" cy="460" r="16" />
    <rect x="138" y="480" width="24" height="60" rx="4" />
    <circle cx="200" cy="460" r="16" />
    <rect x="188" y="480" width="24" height="60" rx="4" />
    <circle cx="250" cy="460" r="16" />
    <rect x="238" y="480" width="24" height="60" rx="4" />

    <circle cx="550" cy="460" r="16" />
    <rect x="538" y="480" width="24" height="60" rx="4" />
    <circle cx="600" cy="460" r="16" />
    <rect x="588" y="480" width="24" height="60" rx="4" />
    <circle cx="650" cy="460" r="16" />
    <rect x="638" y="480" width="24" height="60" rx="4" />
