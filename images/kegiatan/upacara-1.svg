  <path d="M404 110 Q450 90 500 110 T590 110 L590 170 Q540 150 500 170 T404 170 Z" fill="#DC2626" />
  <path d="M404 170 Q450 150 500 170 T590 170 L590 230 Q540 210 500 230 T404 230 Z" fill="#FFFFFF" />

