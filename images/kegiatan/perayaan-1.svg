<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPerayaan1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgPerayaan1)" />
  
  <!-- Stage Backdrop & Festive Elements -->
  <circle cx="400" cy="260" r="180" fill="#FF7A00" opacity="0.15" />
  <circle cx="200" cy="180" r="120" fill="#F59E0B" opacity="0.1" />
  <circle cx="600" cy="200" r="140" fill="#3B82F6" opacity="0.1" />

  <!-- Confetti / Ribbons -->
  <path d="M120 100 Q 150 140 180 120 T 240 150" fill="none" stroke="#FF7A00" stroke-width="4" stroke-linecap="round" />
  <path d="M680 90 Q 640 130 620 110 T 560 140" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <circle cx="280" cy="120" r="6" fill="#10B981" />
  <circle cx="520" cy="110" r="7" fill="#EF4444" />
  <circle cx="380" cy="80" r="5" fill="#F59E0B" />
  <circle cx="450" cy="95" r="6" fill="#3B82F6" />

  <!-- Stage Platform -->
  <polygon points="100,500 700,500 750,560 50,560" fill="#334155" />
  <rect x="50" y="560" width="700" height="40" fill="#1E293B" />
  
  <!-- Podium / Celebration Symbol -->
  <rect x="360" y="320" width="80" height="180" fill="#475569" rx="6" />
  <circle cx="400" cy="270" r="35" fill="#FF7A00" />
  <path d="M385 270 L395 280 L415 260" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Audience Silhouette -->
  <path d="M50 560 Q 200 480 400 520 T 750 560 L 750 600 L 50 600 Z" fill="#090D16" opacity="0.9" />

  <!-- Label Badge -->
  <rect x="40" y="40" width="220" height="38" rx="6" fill="#FF7A00" />
  <text x="55" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Perayaan Hari Besar #1</text>
</svg>
